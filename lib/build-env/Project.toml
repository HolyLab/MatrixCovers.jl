# Build dependencies for the matrixcovers Python and MATLAB packages. The
# runtime dependencies are defined in `../Project.toml`.
#
#     julia --project=lib/build-env -e 'using Pkg; Pkg.instantiate()'

[deps]
JuliaC = "acedd4c2-ced6-4a15-accc-2607eb759ba2"
JuliaLibWrapping = "d61f35a8-f6af-436f-bc10-cee6b101f7bd"

[compat]
JuliaC = "0.3.10"
JuliaLibWrapping = "0.3.3"
julia = "1.13"
