# Build the compiled Python and MATLAB packages in `lib/`, run their smoke
# tests, and keep them as workflow artifacts. A run for a version tag (pushed by
# TagBot, or started by hand with `--ref <tag>`) also attaches them to that
# tag's release. The trigger is the tag push, not the release: TagBot creates
# releases with `GITHUB_TOKEN`, whose events start no workflows.
name: Wrappers
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
# Both jobs compile for the same CPU targets: a generic x86-64 baseline plus
# Sandy Bridge and Haswell clones, so one build runs on any x86-64 machine and
# runs fast on recent ones.
jobs:
  python:
    uses: JuliaInterop/JuliaLibWrapping.jl/.github/workflows/build-wrappers.yml@JuliaLibWrapping-v0.3.0
    with:
      build-dir: lib
      cpu-target: "generic;sandybridge,-xsaveopt,clone_all;haswell,-rdrnd,base(1)"
      smoke-test: lib/test/python/test_smoke.py

  matlab:
    # The MEX file is specific to Linux x86-64, and the runner's glibc must be
    # no newer than the user's.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - uses: julia-actions/cache@v3
      - name: Build the library, its bundle, and the MATLAB sources
        env:
          JULIA_CPU_TARGET: "generic;sandybridge,-xsaveopt,clone_all;haswell,-rdrnd,base(1)"
        run: |
          julia --project=lib/build-env -e 'using Pkg; Pkg.instantiate()'
          julia --project=lib/build-env lib/build.jl
      # R2021a or later, for name=value arguments; building against an early
      # release keeps the MEX file loadable in later ones.
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2021a
      - name: Compile the gateway and run the smoke test
        uses: matlab-actions/run-command@v3
        with:
          command: cd('lib/out'); build_mex; addpath(pwd); run('../test/matlab/smoke.m')
      - name: Collect what a caller needs
        run: |
          cd lib/out
          tar czf "$GITHUB_WORKSPACE/matrixcovers-matlab-glnxa64.tar.gz" \
              +matrixcovers matrixcovers-bundle build_mex.m
      - uses: actions/upload-artifact@v7
        with:
          name: matrixcovers-matlab-glnxa64
          path: matrixcovers-matlab-glnxa64.tar.gz
          if-no-files-found: error

  attach:
    # TagBot creates the release right after pushing the tag; if it does not
    # exist yet, the upload fails and this job can be rerun.
    needs: [python, matlab]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Attach to the release
        run: gh release upload "$GITHUB_REF_NAME" assets/* --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
